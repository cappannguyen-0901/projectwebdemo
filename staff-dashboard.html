<!-- (staff-dashboard, staff-orders... tự chèn inline ở đây) -->

<script>
let staffFloor = 'F1';

document.addEventListener('DOMContentLoaded', () => {
  if (!Auth.requireStaff()) return;

  renderStaffNav('dashboard');

  const user = API.users.getCurrent();
  document.getElementById('staffName').textContent = user.name;

  renderClock();
  setInterval(renderClock, 1000);

  refreshAll();
  setInterval(refreshAll, 10000);
  window.addEventListener('storage', refreshAll);   // khách đặt chỗ/đặt hàng ở tab khác → cập nhật ngay
});

function renderClock() {
  const now = new Date();
  const time = now.toLocaleTimeString('vi-VN');
  const date = now.toLocaleDateString('vi-VN', {
    weekday:'long', day:'2-digit', month:'2-digit', year:'numeric'
  });
  const el = document.getElementById('staffTime');
  if (el) el.innerHTML = `<strong>${time}</strong><br><small>${date}</small>`;
}

function refreshAll() {
  renderStats();
  renderFloorSwitch();
  renderSeatMap();
  renderOrders();
  renderBookings();
}

/* ---------- STATS ---------- */
function renderStats() {
  const seats = API.seats.getAll();
  const available = seats.filter(s => s.status === 'available').length;
  const booked = seats.filter(s => s.status === 'booked').length;
  const activeOrders = API.orders.getActive().length;
  const today = API.stats.today();

  const el = document.getElementById('statsGrid');
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-icon">🪑</div>
      <div class="stat-info">
        <div class="stat-value">${seats.length}</div>
        <div class="stat-label">Tổng số chỗ</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✅</div>
      <div class="stat-info">
        <div class="stat-value">${available}</div>
        <div class="stat-label">Chỗ trống</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔴</div>
      <div class="stat-info">
        <div class="stat-value">${booked}</div>
        <div class="stat-label">Đã đặt</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📦</div>
      <div class="stat-info">
        <div class="stat-value">${activeOrders}</div>
        <div class="stat-label">Đơn đang xử lý</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div class="stat-info">
        <div class="stat-value">${(today.total/1000).toFixed(0)}k</div>
        <div class="stat-label">Doanh thu hôm nay</div>
      </div>
    </div>
  `;
}

/* ---------- SEAT MAP ---------- */
function renderFloorSwitch() {
  const el = document.getElementById('staffFloorSwitch');
  el.innerHTML = API.floors.getAll().map(f => {
    const booked = API.seats.getByFloor(f.id).filter(s => s.status === 'booked').length;
    return `
      <button class="floor-btn-small ${f.id === staffFloor ? 'active' : ''}"
              onclick="switchStaffFloor('${f.id}')">
        ${f.name}${booked > 0 ? ` (${booked})` : ''}
      </button>
    `;
  }).join('');
}

function switchStaffFloor(id) {
  staffFloor = id;
  renderFloorSwitch();
  renderSeatMap();
}

function renderSeatMap() {
  const el = document.getElementById('staffSeatMap');
  const seats = API.seats.getByFloor(staffFloor);
  if (!seats.length) {
    el.innerHTML = '<p class="empty-note">Tầng này chưa có chỗ nào.</p>';
    return;
  }
  const cols = Math.min(seats.length, 4);
  el.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  el.innerHTML = seats.map(s => {
    const activeBooking = API.bookings.getActiveBySeat(s.id);
    const isBooked = s.status === 'booked';
    return `
      <div class="staff-seat ${s.status}">
        ${isBooked ? `<button class="seat-reset-btn"
          onclick="event.stopPropagation(); resetSeat('${s.id}')"
          title="Reset">✕</button>` : ''}
        <div class="seat-icon">🪑</div>
        <div class="seat-id">${s.id}</div>
        <div class="seat-capacity">${s.capacity}👤</div>
        <div class="seat-status">${isBooked ? 'Đã đặt' : 'Trống'}</div>
        ${activeBooking ? `<div class="seat-customer">${activeBooking.id}</div>` : ''}
      </div>
    `;
  }).join('');
}

function resetSeat(seatId) {
  const seat = API.seats.getById(seatId);
  if (!seat || seat.status === 'available') {
    showToast(`Chỗ ${seatId} đang trống!`, '#856404');
    return;
  }
  const activeBooking = API.bookings.getActiveBySeat(seatId);
  const msg = activeBooking
    ? `Reset chỗ ${seatId}? Booking ${activeBooking.id} sẽ hoàn thành.`
    : `Reset chỗ ${seatId} về trống?`;
  if (!confirm(msg)) return;

  if (activeBooking) API.bookings.complete(activeBooking.id);
  else API.seats.release(seatId);

  refreshAll();
  showToast(`✓ Đã reset chỗ ${seatId}`);
}

// Reset tất cả chỗ — dùng API chuẩn để đồng bộ trạng thái ghế
function resetAllSeats() {
  const booked = API.seats.getBooked().length;
  if (booked === 0) { showToast('Tất cả chỗ đã trống!', '#856404'); return; }
  if (!confirm(`Reset TẤT CẢ ${booked} chỗ đã đặt?\nSẽ hoàn thành mọi booking đang hoạt động.`)) return;

  // ⚡ Dùng API chuẩn: complete() tự release ghế + syncFromBookings()
  const n = API.seats.resetAll();
  if (typeof refreshAll === 'function') refreshAll();
  showToast(`✓ Đã reset ${booked} chỗ (hoàn thành ${n} booking)`);
}

/* ---------- ORDERS ---------- */
function renderOrders() {
  const el = document.getElementById('staffOrders');
  const orders = API.orders.getActive()
    .slice().reverse().slice(0, 5);

  if (orders.length === 0) {
    el.innerHTML = '<p class="empty-note">Không có đơn đang xử lý.</p>';
    return;
  }
  const statusText = ['Chờ xử lý', 'Đang pha', 'Shipper lấy', 'Đang giao', 'Hoàn tất'];
  el.innerHTML = orders.map(o => `
    <div class="order-row">
      <div class="order-row-left">
        <strong>#${o.id}</strong>
        <small>${o.items.length} món · ${API.utils.formatVND(o.total)}</small>
      </div>
      <div class="order-row-right">
        <span class="order-status-badge step-${o.step}">${statusText[o.step]}</span>
        <button class="btn-mini" onclick="advanceOrder('${o.id}')">→</button>
      </div>
    </div>
  `).join('');
}

function advanceOrder(orderId) {
  const order = API.orders.getById(orderId);
  if (!order) return;
  const newStep = Math.min(order.step + 1, 4);
  API.orders.updateStep(orderId, newStep);
  refreshAll();
  showToast(`✓ Đơn #${orderId} → bước ${newStep + 1}`);
}

/* ---------- BOOKINGS ---------- */
function renderBookings() {
  const el = document.getElementById('staffBookings');
  const bookings = API.bookings.getAll()
    .filter(b => b.status === 'confirmed')
    .slice().reverse().slice(0, 5);

  if (bookings.length === 0) {
    el.innerHTML = '<p class="empty-note">Không có booking nào.</p>';
    return;
  }
  el.innerHTML = `
    <table class="staff-table">
      <thead>
        <tr><th>Mã</th><th>Khách</th><th>Chỗ</th><th>Tầng</th><th>Giờ</th><th></th></tr>
      </thead>
      <tbody>
        ${bookings.map(b => {
          const user = API.users.getById(b.userId);
          const floor = API.floors.getById(b.floorId);
          return `
            <tr>
              <td><strong>${b.id}</strong></td>
              <td>${user ? esc(user.name) : '—'}</td>
              <td>${b.seatId}</td>
              <td>${floor ? floor.name : '—'}</td>
              <td>${b.time}</td>
              <td>
                <button class="btn-mini" onclick="completeBooking('${b.id}')" title="Hoàn thành">✓</button>
              </td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}
/* ---------- COMPLETE BOOKING (FIX: thiếu hàm) ---------- */
function completeBooking(bookingId) {
  if (!confirm(`Hoàn thành booking ${bookingId}?`)) return;
  const bk = API.bookings.getAll().find(b => b.id === bookingId);
  if (!bk) { showToast('⚠ Không tìm thấy booking', '#c62828'); return; }
  API.bookings.complete(bookingId);
  refreshAll();
  showToast(`✓ Đã hoàn thành booking ${bookingId} (bàn ${bk.seatId})`);
}
window.completeBooking = completeBooking;


</script>
